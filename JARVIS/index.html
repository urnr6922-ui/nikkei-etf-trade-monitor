<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>JARVIS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b12;color:#eef4ff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button{font:inherit}.app{width:100%;max-width:430px;min-height:100vh;margin:auto;padding:20px 18px 24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:700;letter-spacing:.08em}.gear{border:0;background:transparent;color:#b9c7d8;font-size:22px}.orb{width:150px;height:150px;margin:64px auto 24px;border-radius:50%;display:grid;place-items:center;border:1px solid #1e83ff66;box-shadow:0 0 42px #1683ff33,inset 0 0 35px #1683ff22}.orb span{font-size:46px}.prompt{text-align:center;font-size:17px;line-height:1.7}.status{text-align:center;color:#8ea4bd;margin-top:10px;font-size:14px;min-height:22px}.mic{width:82px;height:82px;border-radius:50%;border:0;margin:26px auto 18px;background:#147cff;color:#fff;font-size:34px;box-shadow:0 8px 30px #147cff55}.mic.listening{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.07);opacity:.8}}.actions{display:flex;justify-content:center;gap:10px;margin-bottom:14px}.small{border:1px solid #26364a;background:#0c131e;color:#dce8f5;border-radius:12px;padding:8px 13px}.result{min-height:104px;border:1px solid #1e2b3d;background:#0c131e;border-radius:18px;padding:14px 16px}.label{font-size:12px;color:#7e94ad;margin-bottom:6px}.text{font-size:16px;line-height:1.6;white-space:pre-wrap}.hint{margin-top:16px;color:#8295ab;font-size:12px;line-height:1.8;text-align:center}.settings{display:none;margin-top:14px;border:1px solid #1e2b3d;background:#0c131e;border-radius:16px;padding:14px;font-size:13px;line-height:1.8}.settings.open{display:block}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="title">JARVIS</div><button class="gear" id="gear" aria-label="設定">⚙</button></div>
<div class="orb"><span id="orb">◉</span></div>
<div class="prompt" id="prompt">「JARVIS」と話しかけてください</div>
<div class="status" id="status">待機中…</div>
<button class="mic" id="mic" aria-label="音声入力">🎙</button>
<div class="actions"><button class="small" id="stop">停止</button><button class="small" id="speak">もう一度読み上げ</button></div>
<section class="result"><div class="label">JARVIS</div><div class="text" id="text">マイクを押して話しかけてください。</div></section>
<div class="hint">例）こんにちは / 今の時間を教えて / 今日の日付は？ / 日経平均を見せて</div>
<div class="settings" id="settings">音声：日本語（ja-JP）<br>音声認識：ブラウザー対応時に使用<br>音声合成：Web版はブラウザー、Android版は端末の日本語音声を使用</div>
</main>
<script>
const $=id=>document.getElementById(id);
const mic=$("mic"),status=$("status"),text=$("text"),prompt=$("prompt"),orb=$("orb");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const TTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
let rec=null,lastAnswer="",listening=false,voices=[],speechTimer=null;

function loadVoices(){voices=TTS?speechSynthesis.getVoices():[];return voices}
if(TTS){loadVoices();if('onvoiceschanged' in speechSynthesis)speechSynthesis.onvoiceschanged=loadVoices}

function speak(a){
  lastAnswer=a;
  if(window.AndroidTTS){
    try{
      if(speechTimer)clearTimeout(speechTimer);
      status.textContent='音声で回答中…';
      window.AndroidTTS.speak(a);
      return true;
    }catch(e){
      status.textContent='Android音声出力を開始できませんでした';
      return false;
    }
  }
  if(!TTS){status.textContent='このブラウザーは音声読み上げに対応していません';return false}
  try{
    if(speechTimer)clearTimeout(speechTimer);
    speechSynthesis.cancel();
    loadVoices();
    const u=new SpeechSynthesisUtterance(a);
    u.lang='ja-JP';u.rate=.95;u.pitch=1;u.volume=1;
    const ja=voices.find(v=>/^ja(-|_)/i.test(v.lang));
    if(ja)u.voice=ja;
    let started=false;
    u.onstart=()=>{started=true;status.textContent='音声で回答中…'};
    u.onend=()=>{status.textContent='回答しました'};
    u.onerror=e=>{status.textContent='音声出力を開始できませんでした（'+(e.error||'unknown')+'）'};
    speechSynthesis.resume();
    speechTimer=setTimeout(()=>{
      try{speechSynthesis.speak(u)}catch(e){status.textContent='音声出力を開始できませんでした'}
      setTimeout(()=>{if(!started&&status.textContent==='音声で回答中…')status.textContent='音声出力が開始されませんでした。端末の読み上げ機能を確認してください'},1600);
    },80);
    return true;
  }catch(e){status.textContent='音声出力を開始できませんでした';return false}
}

function answer(q){
 const n=new Date();let a='「'+q+'」を受け取りました。';
 if(/こんにちは|おはよう|こんばんは/.test(q))a='こんにちは。JARVISです。';
 else if(/時間|何時/.test(q))a='現在時刻は '+n.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' です。';
 else if(/日付|何日|今日/.test(q))a='今日は '+n.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'})+' です。';
 else if(/日経平均/.test(q))a='日経平均の最新情報を取得する機能は、次のデータ連携段階で追加します。';
 else if(/ありがとう/.test(q))a='どういたしまして。';
 else a='了解しました。「'+q+'」ですね。現在は基本音声機能が動作しています。';
 text.textContent=a;prompt.textContent='「JARVIS」と話しかけてください';orb.textContent='◉';
 speak(a);
}
function setError(message){listening=false;mic.classList.remove('listening');orb.textContent='◉';status.textContent=message;prompt.textContent='もう一度マイクを押してください'}

if(SR){
 rec=new SR();rec.lang='ja-JP';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;
 rec.onstart=()=>{listening=true;mic.classList.add('listening');status.textContent='聞き取り中…';prompt.textContent='「こんにちは」と話してください';orb.textContent='●'};
 rec.onaudiostart=()=>status.textContent='マイク入力を受信中…';
 rec.onspeechstart=()=>status.textContent='音声を認識中…';
 rec.onresult=e=>{const q=e.results[0][0].transcript.trim();if(!q){setError('音声を認識できませんでした');return}text.textContent='「'+q+'」';status.textContent='回答を準備中…';answer(q)};
 rec.onnomatch=()=>setError('音声を認識できませんでした');
 rec.onerror=e=>{
  if(e.error==='not-allowed'||e.error==='service-not-allowed')setError('マイクの使用が許可されていません。ブラウザーのマイク権限を確認してください');
  else if(e.error==='audio-capture')setError('マイクを使用できません。端末のマイク権限を確認してください');
  else if(e.error==='no-speech')setError('音声が検出されませんでした。もう一度「こんにちは」と話してください');
  else if(e.error==='network')setError('音声認識サービスに接続できません。通信状態を確認してください');
  else setError('音声認識エラー：'+e.error);
 };
 rec.onend=()=>{listening=false;mic.classList.remove('listening');orb.textContent='◉';if(status.textContent==='聞き取り中…'||status.textContent==='マイク入力を受信中…'||status.textContent==='音声を認識中…')status.textContent='待機中…'};
}

mic.onclick=()=>{
 if(!rec){setError('このブラウザーは音声認識に対応していません');return}
 if(listening)return;
 try{status.textContent='マイクを準備中…';rec.start()}catch(e){setError('音声認識を開始できませんでした。少し待ってから再度お試しください')}
};

$("stop").onclick=()=>{if(rec)try{listening=false;rec.stop()}catch(e){}if(window.AndroidTTS){try{window.AndroidTTS.stop()}catch(e){}}else if(TTS){if(speechTimer)clearTimeout(speechTimer);speechSynthesis.cancel()}mic.classList.remove('listening');status.textContent='停止しました';orb.textContent='◉'};
$("speak").onclick=()=>{if(lastAnswer){status.textContent='音声を準備中…';speak(lastAnswer)}else status.textContent='まだ回答がありません。';};
$("gear").onclick=()=>$("settings").classList.toggle('open');
</script>
</body>
</html>
