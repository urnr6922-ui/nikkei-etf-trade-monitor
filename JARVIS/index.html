<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b12"><title>JARVIS</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#eef4ff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}.app{width:100%;max-width:430px;min-height:100vh;margin:auto;padding:22px 18px 24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:700;letter-spacing:.08em}.gear{font-size:22px;opacity:.8}.orb{width:150px;height:150px;margin:72px auto 26px;border-radius:50%;display:grid;place-items:center;border:1px solid #1e83ff66;box-shadow:0 0 42px #1683ff33,inset 0 0 35px #1683ff22}.orb span{font-size:46px}.prompt{text-align:center;font-size:17px;line-height:1.7}.status{text-align:center;color:#8ea4bd;margin-top:12px;font-size:14px}.mic{width:82px;height:82px;border-radius:50%;border:0;margin:30px auto 22px;background:#147cff;color:white;font-size:34px;box-shadow:0 8px 30px #147cff55}.mic:active{transform:scale(.96)}.result{min-height:92px;border:1px solid #1e2b3d;background:#0c131e;border-radius:18px;padding:14px 16px;margin-top:auto}.label{font-size:12px;color:#7e94ad;margin-bottom:6px}.text{font-size:16px;line-height:1.6;white-space:pre-wrap}.hint{margin-top:18px;color:#8295ab;font-size:12px;line-height:1.8;text-align:center}</style></head><body><main class="app"><div class="top"><div class="title">JARVIS</div><div class="gear">⚙</div></div><div class="orb"><span>◉</span></div><div class="prompt" id="prompt">「JARVIS」と話しかけてください</div><div class="status" id="status">待機中…</div><button class="mic" id="mic" aria-label="音声入力">🎙</button><section class="result"><div class="label">JARVIS</div><div class="text" id="text">マイクを押して話しかけてください。</div></section><div class="hint">例）明日の天気を教えて<br>・日経平均を見せて<br>・今の時間を教えて</div></main><script>const mic=document.getElementById('mic'),status=document.getElementById('status'),text=document.getElementById('text'),prompt=document.getElementById('prompt');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;if(SR){rec=new SR();rec.lang='ja-JP';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;rec.onstart=()=>{status.textContent='聞き取り中…';prompt.textContent='話してください';};rec.onresult=e=>{const q=e.results[0][0].transcript;text.textContent='「'+q+'」';status.textContent='回答を準備中…';respond(q);};rec.onerror=e=>{status.textContent='音声認識エラー：'+e.error;text.textContent='マイクの許可を確認してください。';};rec.onend=()=>{if(status.textContent==='聞き取り中…')status.textContent='待機中…';};}function respond(q){let a='「'+q+'」を受け取りました。JARVISの基本音声機能は動作しています。';if(q.includes('時間'))a='現在時刻は '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' です。';text.textContent=a;status.textContent='回答しました';if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(a);u.lang='ja-JP';speechSynthesis.speak(u);}}mic.onclick=()=>{if(!rec){status.textContent='このブラウザでは音声認識に対応していません。';text.textContent='まずは画面操作を利用できます。';return}try{rec.start()}catch(e){}};</script></body></html>
