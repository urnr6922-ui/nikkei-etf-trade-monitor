plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.jarvis.assistant'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.jarvis.assistant'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
