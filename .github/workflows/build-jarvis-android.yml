name: Build JARVIS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'JARVIS-Android/**'
      - '.github/workflows/build-jarvis-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JARVIS-Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Verify build environment
        run: |
          java -version
          gradle --version

      - name: Build APK
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug
          path: JARVIS-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
