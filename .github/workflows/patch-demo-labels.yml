name: One-time demo label cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clarify demo refresh wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('自動更新 ON', '表示設定 ON')
          s = s.replace('自動更新 OFF', '表示設定 OFF')
          s = s.replace("更新: {refresh ? '自動' : '停止'}", "表示設定: {refresh ? 'ON' : 'OFF'}")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit app wording fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet || git commit -m 'Clarify demo refresh controls'
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/patch-demo-labels.yml
          git commit -m 'Remove one-time patch workflow'
          git push
