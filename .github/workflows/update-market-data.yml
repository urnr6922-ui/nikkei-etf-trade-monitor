name: Update market data and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/market-data/**'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PAGES_REPO_NICKNAME: nikkei-etf-trade-monitor

concurrency:
  group: market-data-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch free market data
        run: node scripts/fetch-market.mjs
      - name: Publish refreshed market data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market-data
          if git diff --cached --quiet; then
            echo "No market-data changes to commit"
          else
            git commit -m "data: refresh market data"
            git push origin main
          fi
      - name: Install dependencies
        run: npm install
      - name: Apply market-data connection
        run: node scripts/patch-app.mjs
      - name: Build
        run: npm run build
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
